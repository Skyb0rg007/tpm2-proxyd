[package]
name = "tpm2-proxyd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.5.53", features = ["derive"] }
nix = { version = "0.31.3", features = ["user"] }
rustix = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["tracing", "rt", "rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tpm2-device = "0.6.1"
tpm2-protocol = "0.19.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zlink = { version = "0.5.0", features = ["idl-parse"] }
