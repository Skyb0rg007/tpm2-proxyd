[workspace]
members = [ "tcti" ]

[package]
name = "tpm2-proxyd"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.5.53", features = ["derive"] }
rustix = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["tracing", "rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tpm2-crypto = "0.12.1"
tpm2-device = "0.6.1"
tpm2-protocol = "0.19.0"
tpm2-tpmkey = "0.12.1"
tpm2-vtpm = "0.7.0"
tracing = "0.1.44"
zlink = { version = "0.5.0", features = ["idl-parse"] }
